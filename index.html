<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OHS4LIFE — Spartan Sprint Challenge</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f4f0;color:#1a1a1a;font-size:14px}
:root{--g:#1a6b3a;--gl:#e8f5ee;--gm:#2a8a4a;--gd:#0f4023;--gold:#e8b830;--goldl:#fdf3cc;--goldd:#b8920f;--cream:#f5f4f0;--border:#e0ddd6;--text:#1a1a1a;--muted:#666}

/* PIN SCREEN */
.pin-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:14px;padding:2rem;background:linear-gradient(160deg,#0f4023 0%,#1a6b3a 60%,#2a8a4a 100%)}
.app-logo{font-size:44px}
.app-title{font-size:28px;font-weight:800;color:#e8b830;letter-spacing:-.5px;text-align:center}
.app-sub{font-size:12px;color:rgba(255,255,255,.6);text-align:center;max-width:260px;line-height:1.6}
.pin-card{background:white;border-radius:14px;padding:20px;width:100%;max-width:320px}
.pin-card-title{font-size:11px;font-weight:700;color:var(--g);text-transform:uppercase;letter-spacing:.09em;margin-bottom:12px;text-align:center}
input.pf{width:100%;text-align:center;font-size:22px;font-weight:700;letter-spacing:5px;padding:10px;border-radius:7px;border:1.5px solid var(--border);background:var(--cream);outline:none;margin-bottom:8px;color:var(--text)}
input.pf:focus{border-color:var(--g)}
input.nf{width:100%;font-size:14px;padding:10px 12px;border-radius:7px;border:1.5px solid var(--border);background:var(--cream);outline:none;margin-bottom:8px;color:var(--text)}
input.nf:focus{border-color:var(--g)}
.gbtn{width:100%;padding:11px;border-radius:8px;border:none;background:var(--gold);color:#0f4023;font-size:13px;font-weight:800;cursor:pointer;margin-bottom:6px}
.gbtn:hover{background:var(--goldd);color:white}
.gbtn.outline{background:transparent;border:2px solid var(--border);color:var(--muted)}
.pin-div{display:flex;align-items:center;gap:8px;margin:6px 0}
.pin-div-line{flex:1;height:1px;background:var(--border)}
.pin-div-txt{font-size:10px;color:#aaa}
.perr{font-size:11px;color:#c02828;background:#fceaea;padding:5px 10px;border-radius:5px;text-align:center}
.pnote{font-size:10px;color:rgba(255,255,255,.4);text-align:center;max-width:260px;line-height:1.6}

/* QUIZ SCREEN */
.quiz-screen{display:none;min-height:100vh;background:var(--cream);padding:0 0 40px}
.quiz-hdr{background:var(--g);padding:20px 16px 16px;color:white}
.quiz-hdr-title{font-size:18px;font-weight:800;color:var(--gold);margin-bottom:4px}
.quiz-hdr-sub{font-size:12px;color:rgba(255,255,255,.7)}
.quiz-progress{height:4px;background:rgba(255,255,255,.2);border-radius:2px;margin-top:12px;overflow:hidden}
.quiz-progress-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .4s}
.quiz-body{padding:16px;max-width:560px;margin:0 auto}
.quiz-section{margin-bottom:20px}
.quiz-sec-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--g);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.quiz-sec-title::after{content:'';flex:1;height:1px;background:var(--border)}
.quiz-q{background:white;border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:6px;overflow:hidden}
.quiz-q-text{font-size:13px;font-weight:500;color:var(--text);margin-bottom:8px;line-height:1.5}
.quiz-opts{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.quiz-opt{padding:5px 12px;border-radius:20px;border:1.5px solid var(--border);background:white;font-size:12px;cursor:pointer;color:var(--muted);transition:all .15s;flex-shrink:0;max-width:100%}
.quiz-opt.sel{background:var(--g);border-color:var(--g);color:white;font-weight:600}
.quiz-opt-yn{padding:5px 14px;border-radius:20px;border:1.5px solid var(--border);background:white;font-size:12px;cursor:pointer;color:var(--muted)}
.quiz-opt-yn.sel-y{background:var(--g);border-color:var(--g);color:white;font-weight:600}
.quiz-opt-yn.sel-n{background:#fceaea;border-color:#c02828;color:#c02828;font-weight:600}
.quiz-submit{width:100%;padding:14px;border-radius:10px;border:none;background:var(--g);color:white;font-size:15px;font-weight:800;cursor:pointer;margin-top:10px}
.tier-result{background:var(--g);border-radius:14px;padding:20px;margin:16px 0;color:white;text-align:center}
.tier-badge{font-size:36px;margin-bottom:8px}
.tier-name{font-size:22px;font-weight:800;color:var(--gold);margin-bottom:6px}
.tier-desc{font-size:12px;color:rgba(255,255,255,.8);line-height:1.6;margin-bottom:12px}

/* MAIN APP */
.app{display:none;min-height:100vh;flex-direction:column}
.hdr{background:var(--g);padding:10px 14px 8px;position:sticky;top:0;z-index:50}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.hdr-logo{font-size:14px;font-weight:800;color:var(--gold)}
.hdr-user{font-size:10px;color:rgba(255,255,255,.6);background:rgba(255,255,255,.1);padding:2px 8px;border-radius:5px;cursor:pointer}
.sync{font-size:10px;padding:3px 9px;border-radius:8px;font-weight:500}
.s-ok{background:#0d2a1a;color:#4ade80}
.s-save{background:#2a2200;color:#fbbf24}
.s-err{background:#2a0d0d;color:#f87171}
.ntabs{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;margin-bottom:6px}
.ntabs::-webkit-scrollbar{display:none}
.ntab{flex-shrink:0;padding:5px 12px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;background:rgba(255,255,255,.1);color:rgba(255,255,255,.6);border:none;letter-spacing:.03em;text-transform:uppercase}
.ntab.active{background:var(--gold);color:var(--gd, #0f4023)}
.tier-pill{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;padding:3px 10px;border-radius:10px;background:rgba(255,255,255,.15);color:white}
.wnav{display:flex;align-items:center;gap:6px;margin-top:4px}
.wb{background:rgba(255,255,255,.1);border:none;border-radius:5px;width:24px;height:24px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.7)}
.wlbl{font-size:10px;color:rgba(255,255,255,.6);font-weight:500;min-width:120px;text-align:center}
.dtabs{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;margin-top:4px}
.dtabs::-webkit-scrollbar{display:none}

.main{padding:12px;max-width:580px;margin:0 auto;padding-bottom:40px;flex:1}
.page{display:none;flex-direction:column;gap:5px}
.page.active{display:flex}
.spin-wrap{display:flex;align-items:center;justify-content:center;gap:8px;padding:48px;color:#999}
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--g);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* CARDS */
.card{background:white;border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:5px}
.card-green{background:var(--gl);border-color:#a8d8b8}
.card-gold{background:var(--goldl);border-color:#d4a020}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.st{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sec{margin-bottom:10px}
.dh{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.dn{font-size:24px;font-weight:800}
.lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:block;margin-bottom:4px}
textarea,input[type=text],input[type=number]{width:100%;background:var(--cream);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-family:inherit;font-size:13px;color:var(--text);outline:none;resize:none}
textarea:focus,input:focus{border-color:var(--g)}
textarea{min-height:60px;line-height:1.6}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{display:none}
.pbar{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:4px}
.pbf{height:100%;border-radius:3px;transition:width .3s;background:var(--g)}
.pbf-gold{background:var(--gold)}

/* HABIT ROW */
.hr{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid #f0ede6;cursor:pointer;user-select:none}
.hr:last-child{border-bottom:none;padding-bottom:0}
.hr:first-child{padding-top:0}
.hc{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);background:white;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:white}
.hc.on{background:var(--g);border-color:var(--g)}
.hl{flex:1;font-size:13px;color:#444}
.hl.done{text-decoration:line-through;color:#bbb}
.htag{font-size:10px;padding:2px 7px;border-radius:5px;background:var(--cream);color:var(--muted);border:1px solid var(--border);white-space:nowrap}

/* WORKOUT */
.ex-card{background:white;border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:6px}
.ex-phase{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--g);margin-bottom:5px;display:flex;align-items:center;justify-content:space-between}
.ex-list{display:flex;flex-direction:column;gap:3px}
.ex-row{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:1px solid #f5f4f0}
.ex-row:last-child{border-bottom:none}
.ex-letter{font-size:10px;font-weight:700;color:white;background:var(--g);border-radius:3px;padding:1px 5px;flex-shrink:0;margin-top:1px}
.ex-name{flex:1}
.ex-name-txt{font-size:12px;font-weight:600;color:var(--text)}
.ex-sets{font-size:11px;color:var(--muted)}
.ex-note{font-size:10px;color:var(--g);font-style:italic;margin-top:1px}
.log-row{display:grid;grid-template-columns:auto 1fr 1fr;gap:4px;margin-top:4px}
.log-row input{padding:4px 6px;font-size:11px;text-align:center}

/* FITNESS SCORE */
.fitness-letter{background:var(--g);border-radius:10px;padding:12px;margin-bottom:6px}
.fl-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.fl-letter{font-size:28px;font-weight:900;color:var(--gold);line-height:1}
.fl-word{font-size:11px;font-weight:700;color:white;text-transform:uppercase;letter-spacing:.06em}
.fl-desc{font-size:11px;color:rgba(255,255,255,.7);line-height:1.5;margin-bottom:8px}
.fl-score-row{display:flex;gap:4px}
.fl-score-btn{flex:1;padding:6px 2px;border-radius:5px;border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:rgba(255,255,255,.5);font-size:11px;font-weight:700;cursor:pointer;text-align:center}
.fl-score-btn.sel{background:var(--gold);border-color:var(--gold);color:#0f4023}

/* LEADERBOARD */
.lb-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f0ede6}
.lb-row:last-child{border-bottom:none}
.lb-rank{font-size:18px;font-weight:800;width:28px;text-align:center;flex-shrink:0}
.lb-name{flex:1;font-size:13px;font-weight:600}
.lb-tier{font-size:10px;padding:2px 7px;border-radius:10px;background:var(--gl);color:var(--g);font-weight:600;flex-shrink:0}
.lb-val{font-size:13px;font-weight:700;color:var(--g);flex-shrink:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.stat{background:white;border:1px solid var(--border);border-radius:8px;padding:9px 10px;text-align:center}
.snum{font-size:20px;font-weight:800;color:var(--g)}
.slbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.note{font-size:11px;color:var(--muted);padding:8px 11px;background:var(--cream);border-radius:6px;border:1px solid var(--border);line-height:1.6;margin:4px 0}
.divider{height:1px;background:var(--border);margin:12px 0}
.supp-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #f0ede6}
.supp-row:last-child{border-bottom:none}
.supp-icon{width:28px;height:28px;border-radius:6px;background:var(--gl);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.supp-name{flex:1;font-size:12px;font-weight:600;color:var(--text)}
.supp-time{font-size:10px;color:var(--muted)}
.vl{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--g);text-decoration:none;border:1px solid #a8d8b8;border-radius:5px;padding:3px 8px;margin:3px 2px 0 0;background:var(--gl)}
.time-badge{font-size:10px;font-weight:600;color:var(--g);background:var(--gl);padding:2px 7px;border-radius:5px;border:1px solid #a8d8b8}
.week-badge{font-size:10px;font-weight:700;color:var(--goldd);background:var(--goldl);padding:2px 8px;border-radius:5px;border:1px solid #d4a020}
</style>
</head>
<body>

<!-- PIN SCREEN -->
<div id="pinScreen" class="pin-screen">
  <div class="app-logo">🏔️</div>
  <div class="app-title">OHS4LIFE</div>
  <div class="app-sub">Spartan Sprint Challenge · Nov 21 · Train together. Finish together.</div>
  <div class="pin-card">
    <div class="pin-card-title">Enter your PIN</div>
    <input class="pf" id="pinInput" type="number" placeholder="PIN">
    <button class="gbtn" onclick="enterPin()">Let's Go</button>
    <div class="pin-div"><div class="pin-div-line"></div><div class="pin-div-txt">New? Create account</div><div class="pin-div-line"></div></div>
    <input class="nf" id="newName" type="text" placeholder="Your first name">
    <input class="pf" id="newPin" type="number" placeholder="Pick a PIN" style="letter-spacing:5px">
    <button class="gbtn outline" onclick="createAccount()">Create account</button>
    <div id="pinErr" class="perr" style="display:none;margin-top:6px"></div>
  </div>
  <div class="pnote">Same PIN every time. Share it with no one — it's yours.</div>
</div>

<!-- QUIZ SCREEN -->
<div id="quizScreen" class="quiz-screen">
  <div class="quiz-hdr">
    <div class="quiz-hdr-title">Fitness Assessment</div>
    <div class="quiz-hdr-sub">Answer honestly — this builds your personal training plan</div>
    <div class="quiz-progress"><div class="quiz-progress-fill" id="quizProgress" style="width:0%"></div></div>
  </div>
  <div class="quiz-body" id="quizBody"></div>
</div>

<!-- MAIN APP -->
<div id="mainApp" class="app">
  <div class="hdr">
    <div class="hdr-top">
      <div class="hdr-logo">🏔️ OHS4LIFE</div>
      <div style="display:flex;align-items:center;gap:7px">
        <div class="hdr-user" id="userBdg" onclick="logout()">— · logout</div>
        <div id="syncBadge" class="sync s-save">...</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
      <div class="tier-pill" id="tierPill">Tier —</div>
      <div style="font-size:10px;color:rgba(255,255,255,.5)" id="raceCountdown"></div>
    </div>
    <div class="ntabs" id="navTabs">
      <button class="ntab active" onclick="setPage('daily',this)">Daily</button>
      <button class="ntab" onclick="setPage('fitness',this)">F.I.T.N.E.S.S</button>
      <button class="ntab" onclick="setPage('spartan',this)">Spartan</button>
      <button class="ntab" onclick="setPage('leaderboard',this)">Squad</button>
      <button class="ntab" onclick="setPage('settings',this)">⚙️ Me</button>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div class="wnav">
        <button class="wb" onclick="changeWeek(-1)">‹</button>
        <div class="wlbl" id="weekRange"></div>
        <button class="wb" onclick="changeWeek(1)">›</button>
      </div>
      <div class="dtabs" id="dayTabsWrap"></div>
    </div>
  </div>
  <div class="main">
    <div id="page-daily" class="page active"><div id="dailyContent"><div class="spin-wrap"><div class="spinner"></div></div></div></div>
    <div id="page-fitness" class="page"><div id="fitnessContent"></div></div>
    <div id="page-spartan" class="page"><div id="spartanContent"></div></div>
    <div id="page-leaderboard" class="page"><div id="lbContent"></div></div>
    <div id="page-settings" class="page"><div id="settingsContent"></div></div>
  </div>
</div>

<script>
const SHEET='https://script.google.com/macros/s/AKfycbzZ3P6lgEuM94ySA5DMWur2LWCcfoFHbIuyP_1yxbHcyqutfsmqLJbJgccIR8ktA4FYsA/exec'; // ADD YOUR GOOGLE SHEET URL HERE
const RACE_DATE=new Date('2026-11-21');
const TRAIN_START=new Date('2026-04-16'); // fallback only
function getTrainStart(){
  try{
    const p=localStorage.getItem('ohs_user_'+pin);
    if(p){const prof=JSON.parse(p);if(prof.startDate)return new Date(prof.startDate);}
  }catch(e){}
  return TRAIN_START;
}
function getTrainingWeek(){
  const start=getTrainStart();
  return Math.max(1,Math.ceil((new Date()-start)/(7*24*60*60*1000)));
}
let _n=0;
function jsonp(url,retries=2){return new Promise((res,rej)=>{const cb='_oh'+(++_n),s=document.createElement('script');const t=setTimeout(()=>{cleanup();if(retries>0)jsonp(url,retries-1).then(res).catch(rej);else rej(new Error('timeout'))},12000);function cleanup(){clearTimeout(t);delete window[cb];if(s.parentNode)s.parentNode.removeChild(s);}window[cb]=d=>{cleanup();res(d);};s.src=url+(url.includes('?')?'&':'?')+'callback='+cb+'&t='+Date.now();s.onerror=()=>{cleanup();if(retries>0)jsonp(url,retries-1).then(res).catch(rej);else rej(new Error('err'));};document.head.appendChild(s);});}

const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const SHORT=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

// ── TIER SYSTEM ──────────────────────────────────────────
const TIERS={
  1:{name:'Spark',emoji:'✨',desc:'Just getting started. Every step counts. We build the habit first.',color:'#5a8a6a'},
  2:{name:'Rise',emoji:'🌱',desc:'Building momentum. You can move — now we teach your body to move better.',color:'#2a8a4a'},
  3:{name:'Build',emoji:'💪',desc:'Solid foundation. Time to add intensity and start running.',color:'#1a6b3a'},
  4:{name:'Drive',emoji:'🔥',desc:'Consistent and capable. Spartan-specific training begins now.',color:'#0f4023'},
  5:{name:'Forge',emoji:'⚔️',desc:'Athletic and ready. Full Spartan circuits. No excuses.',color:'#0a2a16'}
};

// ── WORKOUTS BY TIER & DAY ────────────────────────────────
// 3 workout days (Mon/Wed/Fri) + 1 cardio day (Sat) + rest other days
const WORKOUTS={
  1:{ // SPARK
    1:{name:'Full Body Foundation',phases:[
      {label:'Warm-up · 5 min',exs:[{l:'A',n:'March in place',s:'2 min',note:'Lift knees high, swing arms'},{l:'B',n:'Arm circles',s:'×10 each direction'},{l:'C',n:'Ankle rolls',s:'×10 each'}]},
      {label:'Proprioception · Balance',exs:[{l:'A',n:'Single leg stand',s:'3×10s each leg — eyes open',note:'Touch wall if needed'},{l:'B',n:'Heel-to-toe walk',s:'10 steps forward + back',note:'Like a sobriety test — eyes forward'},{l:'C',n:'Weight shifts side to side',s:'2×10 — slow and controlled'}]},
      {label:'Strength · Bodyweight',exs:[{l:'A',n:'Sit-to-stand from chair',s:'3×10 — no hands',note:'This IS a squat'},{l:'B',n:'Wall pushup',s:'3×10'},{l:'C',n:'Standing hip hinge',s:'3×10 — bend at hips, soft knees'}]},
      {label:'Cool down',exs:[{l:'A',n:'Seated hamstring stretch',s:'30s each'},{l:'B',n:'Doorway chest stretch',s:'30s'}]}
    ]},
    3:{name:'Move & Balance',phases:[
      {label:'Warm-up · 5 min',exs:[{l:'A',n:'Walk in place',s:'2 min'},{l:'B',n:'Leg swings',s:'×10 each direction'},{l:'C',n:'Hip circles',s:'×10 each side'}]},
      {label:'Proprioception · Balance',exs:[{l:'A',n:'Single leg stand eyes closed',s:'3×5s each — progress from eyes open',note:'Touch wall for safety'},{l:'B',n:'Tandem stance hold',s:'3×15s — one foot directly in front of other'},{l:'C',n:'Head turns on 1 leg',s:'3×5 each — turn head while balancing'}]},
      {label:'Strength',exs:[{l:'A',n:'Supported squat (hold chair)',s:'3×10'},{l:'B',n:'Incline pushup (hands on bench)',s:'3×8'},{l:'C',n:'Standing calf raise',s:'3×15'}]},
      {label:'Core',exs:[{l:'A',n:'Seated knee lifts',s:'3×10 each'},{l:'B',n:'Standing side bend',s:'3×10 each side'}]}
    ]},
    5:{name:'Cardio Base + Strength',phases:[

let pin='',userName='',userTier=3,quizAnswers={},wOff=0,curDay=new Date().getDay(),state={},sTimer=null,loaded=false,curPage='daily';

function wk(o=0){const n=new Date(),d=n.getDay(),s=new Date(n);s.setDate(n.getDate()-d+(o*7));return s.toISOString().split('T')[0];}
function wDates(o=0){const n=new Date(),d=n.getDay(),s=new Date(n);s.setDate(n.getDate()-d+(o*7));return Array.from({length:7},(_,i)=>{const x=new Date(s);x.setDate(s.getDate()+i);return x;});}
function fmtR(o){const d=wDates(o),op={month:'short',day:'numeric'};return d[1].toLocaleDateString('en-US',op)+' – '+d[6].toLocaleDateString('en-US',op);}
function sb(s,m){const b=document.getElementById('syncBadge');if(!b)return;if(s==='ok'){b.className='sync s-ok';b.textContent='Synced ✓'}else if(s==='s'){b.className='sync s-save';b.textContent='Saving...'}else{b.className='sync s-err';b.textContent=m||'Local only'}}
function userKey(){return 'ohs_user_'+pin;}
function weekKey(){return 'ohs_week_'+pin+'_'+wk(wOff);}
async function load(){
  if(!SHEET){try{const l=localStorage.getItem(weekKey());state=l?JSON.parse(l):{}}catch(e){state={}}sb('ok');loaded=true;return;}
  sb('s','Loading...');
  try{
    const r=await jsonp(SHEET+'?action=get&key='+encodeURIComponent(weekKey()));
    if(r&&r.status==='found'&&r.value){
      state=JSON.parse(r.value);
      try{localStorage.setItem(weekKey(),r.value)}catch(e){}
    } else {
      try{const l=localStorage.getItem(weekKey());state=l?JSON.parse(l):{}}catch(e){state={}}
    }
    sb('ok');
  } catch(e){
    try{const l=localStorage.getItem(weekKey());state=l?JSON.parse(l):{}}catch(e2){state={}}
    sb('err','Saved locally');
  }
  loaded=true;
}
function sched(){sb('s','Saving...');if(sTimer)clearTimeout(sTimer);sTimer=setTimeout(doSave,1200);}
async function doSave(){
  const p=JSON.stringify(state);
  try{localStorage.setItem(weekKey(),p)}catch(e){}
  if(!SHEET){sb('ok');saveUserProfile();return;}
  try{
    const r=await jsonp(SHEET+'?action=set&key='+encodeURIComponent(weekKey())+'&value='+encodeURIComponent(p));
    sb(r&&r.status==='saved'?'ok':'err','Saved locally');
  }catch(e){
    sb('err','Saved locally');
  }
  saveUserProfile();
}
function saveUserProfile(){
  const profile={name:userName,pin,tier:userTier,lastSeen:new Date().toISOString()};
  try{localStorage.setItem(userKey(),JSON.stringify(profile));}catch(e){}
  if(SHEET){jsonp(SHEET+'?action=set&key='+encodeURIComponent(userKey())+'&value='+encodeURIComponent(JSON.stringify(profile))).catch(()=>{})}
  registerUser();
}
function registerUser(){
  const listKey='ohs_users';
  let users=[];try{const l=localStorage.getItem(listKey);if(l)users=JSON.parse(l);}catch(e){}
  const idx=users.findIndex(u=>u.pin===pin);
  const entry={name:userName,pin,tier:userTier};
  if(idx>=0)users[idx]=entry;else users.push(entry);
  try{localStorage.setItem(listKey,JSON.stringify(users));}catch(e){}
  if(SHEET){jsonp(SHEET+'?action=set&key='+encodeURIComponent(listKey)+'&value='+encodeURIComponent(JSON.stringify(users))).catch(()=>{})}
}
function g(p,d=null){const pts=p.split('.');let o=state;for(const x of pts){if(o==null||typeof o!=='object')return d;o=o[x];}return o!=null?o:d;}
function sv(p,v){const pts=p.split('.');let o=state;for(let i=0;i<pts.length-1;i++){if(!o[pts[i]])o[pts[i]]={};o=o[pts[i]];}o[pts[pts.length-1]]=v;sched();}
function tog(p){sv(p,!g(p,false));}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function enterPin(){
  const v=document.getElementById('pinInput').value.toString().trim();
  const e=document.getElementById('pinErr');
  if(v.length<4){e.textContent='PIN must be at least 4 digits';e.style.display='block';return;}
  e.style.display='none';
  const profileKey='ohs_user_'+v;
  let profile=null;
  // Try localStorage first for speed
  try{const l=localStorage.getItem(profileKey);if(l)profile=JSON.parse(l);}catch(err){}
  if(profile&&profile.name){
    pin=v;userName=profile.name;userTier=profile.tier||3;launchApp();
  } else if(SHEET){
    // Try loading from sheet
    e.textContent='Looking up your account...';e.style.display='block';
    jsonp(SHEET+'?action=get&key='+encodeURIComponent(profileKey)).then(r=>{
      if(r&&r.status==='found'&&r.value){
        profile=JSON.parse(r.value);
        try{localStorage.setItem(profileKey,r.value);}catch(err){}
        pin=v;userName=profile.name;userTier=profile.tier||3;
        e.style.display='none';
        launchApp();
      } else {
        e.textContent='PIN not found. Create an account below.';e.style.display='block';
      }
    }).catch(()=>{
      e.textContent='PIN not found. Create an account below.';e.style.display='block';
    });
  } else {
    e.textContent='PIN not found. Create an account below.';e.style.display='block';
  }
}

        e.style.display='none';
        pin=newPin;userName=name;userTier=3;
        const profile={name,pin:newPin,tier:3,startDate:new Date().toISOString().split('T')[0],lastSeen:new Date().toISOString()};
        try{localStorage.setItem('ohs_user_'+newPin,JSON.stringify(profile));}catch(e2){}
        document.getElementById('pinScreen').style.display='none';

      });

function startQuiz(){

function renderQuiz(){
  const body=document.getElementById('quizBody');
  let H='';
  QUIZ_QUESTIONS.forEach((section,si)=>{
    H+=`<div class="quiz-section">
      <div class="quiz-sec-title">${section.section}</div>`;
    section.questions.forEach(q=>{
      H+=`<div class="quiz-q">
        <div class="quiz-q-text">${q.text}</div>
        <div class="quiz-opts">`;
      if(q.showIf&&quizAnswers[q.showIf.id]!==q.showIf.val){
        H+=`<div style="font-size:11px;color:#bbb;font-style:italic;padding:4px 0">Select "Yes" above to unlock this</div>`;
      } else if(q.type==='yn'){
        H+=`<button class="quiz-opt-yn ${quizAnswers[q.id]==='yes'?'sel-y':''}" onclick="setAnswer('${q.id}','yes',this,'yn')">✓ Yes</button>
            <button class="quiz-opt-yn ${quizAnswers[q.id]==='no'?'sel-n':''}" onclick="setAnswer('${q.id}','no',this,'yn')">✗ No</button>`;
      } else if(q.type==='multi'){
        const selected=quizAnswers[q.id]||[];
        q.opts.forEach(opt=>{
          const isSel=Array.isArray(selected)&&selected.includes(opt);
          H+=`<button class="quiz-opt ${isSel?'sel':''}" onclick="toggleMulti('${q.id}','${opt}',this)">${opt}</button>`;
        });
      } else if(q.type==='text_optional'){
        H+=`<input type="text" style="width:100%;padding:8px 10px;border-radius:7px;border:1.5px solid var(--border);background:var(--cream);font-size:13px;outline:none" placeholder="Optional — describe your injury (e.g. torn meniscus, rotator cuff surgery)..." value="${quizAnswers[q.id]||''}" oninput="quizAnswers['${q.id}']=this.value">`;
      } else if(q.type==='mc_vertical'){
        q.opts.forEach((opt,oi)=>{
          H+=`<button class="quiz-opt ${quizAnswers[q.id]===opt?'sel':''}" onclick="setAnswer('${q.id}','${opt}',this,'mc')" style="width:100%;text-align:left;border-radius:8px;padding:8px 12px;margin-bottom:3px">${opt}</button>`;
        });
      } else {
        q.opts.forEach((opt,oi)=>{
          H+=`<button class="quiz-opt ${quizAnswers[q.id]===opt?'sel':''}" onclick="setAnswer('${q.id}','${opt}',this,'mc')" style="width:100%;text-align:left;border-radius:8px;padding:8px 12px;margin-bottom:3px;display:block">${opt}</button>`;
        });
      }
      H+=`</div></div>`;
    });
    H+=`</div>`;
  });
  H+=`<button class="quiz-submit" onclick="submitQuiz()">Calculate My Fitness Tier →</button>`;
  body.innerHTML=H;
}
function toggleMulti(id,val,el){
  if(!quizAnswers[id])quizAnswers[id]=[];
  const idx=quizAnswers[id].indexOf(val);
  if(idx>=0)quizAnswers[id].splice(idx,1);
  else quizAnswers[id].push(val);
  el.classList.toggle('sel',quizAnswers[id].includes(val));
  const total=QUIZ_QUESTIONS.reduce((a,s)=>a+s.questions.length,0);
  const done=Object.keys(quizAnswers).length;
  document.getElementById('quizProgress').style.width=Math.round((done/total)*100)+'%';
}
function setAnswer(id,val,el,type){
  quizAnswers[id]=val;
  // If this is a showIf trigger question, re-render the whole quiz
  const isShowIfTrigger=QUIZ_QUESTIONS.some(s=>s.questions.some(q=>q.showIf&&q.showIf.id===id));
  if(isShowIfTrigger){
    renderQuiz();
    return;
  }
  // Update UI
  const parent=el.parentElement;
  if(type==='yn'){
    parent.querySelectorAll('.quiz-opt-yn').forEach(b=>{b.classList.remove('sel-y','sel-n');});
    el.classList.add(val==='yes'?'sel-y':'sel-n');
  } else {
    parent.querySelectorAll('.quiz-opt').forEach(b=>b.classList.remove('sel'));
    el.classList.add('sel');
  }
  // Update progress
  const total=QUIZ_QUESTIONS.reduce((a,s)=>a+s.questions.length,0);
  const done=Object.keys(quizAnswers).length;
  document.getElementById('quizProgress').style.width=Math.round((done/total)*100)+'%';
}
function submitQuiz(){
  // Calculate tier from answers
  let score=0;
  const yes=(id)=>quizAnswers[id]==='yes';
  // Movement (7 questions)
  if(yes('q_squat'))score+=2;
  if(yes('q_pushup'))score+=2;
  if(yes('q_burpee'))score+=3;
  if(yes('q_pullup'))score+=3;
  if(yes('q_lunge'))score+=1;
  if(yes('q_toes'))score+=1;
  if(yes('q_overhead'))score+=1;
  // Balance (5 questions)
  if(yes('q_1leg_open'))score+=1;
  if(yes('q_1leg_closed'))score+=2;
  if(yes('q_heel_toe'))score+=1;
  if(yes('q_head_turn'))score+=2;
  if(yes('q_rdl'))score+=3;
  // Cardio
  if(yes('q_walk20'))score+=1;
  if(yes('q_jog5'))score+=2;
  if(yes('q_run1'))score+=2;

  // Assign tier
  if(score<=5)userTier=1;
  else if(score<=10)userTier=2;
  else if(score<=16)userTier=3;
  else if(score<=22)userTier=4;
  else userTier=5;

  const tier=TIERS[userTier];
  const body=document.getElementById('quizBody');
  body.innerHTML=`
    <div class="tier-result">
      <div class="tier-badge">${tier.emoji}</div>
      <div class="tier-name">Tier ${userTier} — ${tier.name}</div>
      <div class="tier-desc">${tier.desc}</div>
      <div style="font-size:12px;color:rgba(255,255,255,.6);margin-bottom:14px">Score: ${score}/27 · You can retake this anytime to level up</div>
    </div>
    <div class="card" style="margin-bottom:12px">
      <div style="font-size:12px;color:#555;line-height:1.7">
        ${userTier===1?'Your workouts focus on building the movement habit with basic bodyweight exercises and balance work. Every session is achievable. We start here together.':
          userTier===2?'You can move — now we add structure. Your workouts build strength and coordination with gym machines and bodyweight circuits, plus walk/jog intervals for the Spartan 5K run.':
          userTier===3?'Solid base. Your workouts add intensity, obstacle-specific training, and running intervals. The Spartan Sprint is absolutely within reach.':
          userTier===4?'You\'re ready to push. Spartan-specific circuits, heavier carries, rope work, and race-pace run training. This will challenge you.':
          'Full Spartan athlete program. Weighted movements, full circuits, race simulations. You\'re going to crush the Sprint.'}
      </div>
    </div>
    <button class="quiz-submit" onclick="finalizeAccount()">Start Training →</button>`;
}
function finalizeAccount(){
  const injuryParts=quizAnswers.q_injury==='yes'?(quizAnswers.q_injury_parts||[]):[];
  const profile={name:userName,pin,tier:userTier,quizAnswers,injuries:injuryParts,lastSeen:new Date().toISOString()};

    note:'⚠️ Wrist/Elbow — neutral grip, reduce range. Stop if sharp pain.',
    swap:{'Pushup':'Incline pushup or chest press machine','Farmer carry':'Trap bar carry'}
  },

  }

function getInjuryNote(exName,injuries){
  if(!injuries||!injuries.length)return '';
  const name=exName.toLowerCase();
  for(const inj of injuries){
    const mod=INJURY_MODS[inj];
    if(!mod)continue;
    for(const flag of mod.flag){
      if(name.includes(flag.toLowerCase()))return mod.note;
    }
  }
  return '';
}

// ── LEADERBOARD PAGE ──────────────────────────────────────
async function renderLeaderboard(){
  const mc=document.getElementById('lbContent');
  mc.innerHTML='<div class="spin-wrap"><div class="spinner"></div></div>';

  // Load all users
  let users=[];
  if(SHEET){
    try{const r=await jsonp(SHEET+'?action=get&key=ohs_users');if(r&&r.status==='found'&&r.value)users=JSON.parse(r.value);}catch(e){}
  }
  if(!users.length){try{const l=localStorage.getItem('ohs_users');if(l)users=JSON.parse(l);}catch(e){}}

  // Load current week data for each user
  const now=new Date(),wd=now.getDay(),ws=new Date(now);ws.setDate(now.getDate()-wd);
  const currentWkStart=ws.toISOString().split('T')[0];

  let memberData=[];
  for(const u of users){
    const wkKey='ohs_week_'+u.pin+'_'+currentWkStart;
    let data={};
    try{const l=localStorage.getItem(wkKey);if(l)data=JSON.parse(l);}catch(e){}
    if(SHEET){try{const r=await jsonp(SHEET+'?action=get&key='+encodeURIComponent(wkKey));if(r&&r.status==='found'&&r.value)data=JSON.parse(r.value);}catch(e){}}

    let sessions=0,burpees=0,hang=0,fitnessScore=0;
    for(let d=0;d<=6;d++){
      if(data[`d${d}`]&&data[`d${d}`].training&&data[`d${d}`].training.done)sessions++;
      const sp=data[`d${d}`]&&data[`d${d}`].spartan;
      if(sp){burpees+=(parseInt(sp.burpees)||0);hang=Math.max(hang,parseInt(sp.hang)||0);}
    }
    const trainingWeek=getTrainingWeek();
    const wkFitKey=`fitness_wk${trainingWeek}`;
    if(data[wkFitKey]){
      fitnessScore=['F','I','T','N','E','S','S2'].reduce((a,l)=>a+(parseInt(data[wkFitKey][l==='S2'?'S':l])||0),0);
    }
    memberData.push({...u,sessions,burpees,hang,fitnessScore,isMe:u.pin===pin});
  }

  // Sort by F.I.T.N.E.S.S. score
  const sorted=[...memberData].sort((a,b)=>b.fitnessScore-a.fitnessScore||b.sessions-a.sessions);

  let H=`<div class="dh"><div class="dn" style="color:var(--g)">OHS Squad</div><div class="dm"><div style="font-size:10px;color:var(--muted)">This week</div><div style="font-size:14px;font-weight:700;color:var(--g)">${sorted.length} members</div></div></div>`;

  // MAIN LEADERBOARD
  H+=`<div class="sec"><div class="sh"><div class="st"><div class="dot" style="background:var(--gold)"></div>F.I.T.N.E.S.S. leaderboard</div></div>
  <div class="card">
    ${sorted.map((m,i)=>`<div class="lb-row">
      <div class="lb-rank">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</div>
      <div style="flex:1"><div class="lb-name">${esc(m.name)}${m.isMe?' 👋':''}</div>
        <div class="lb-tier">${TIERS[m.tier||3].emoji} ${TIERS[m.tier||3].name}</div>
      </div>
      <div style="text-align:right"><div class="lb-val">${m.fitnessScore}/63</div><div style="font-size:10px;color:var(--muted)">${m.sessions} sessions</div></div>
    </div>`).join('')}
  </div></div>`;

  // SECONDARY LEADERBOARDS
  const lbs=[
    {title:'Most sessions',key:'sessions',unit:'sessions',color:'var(--g)'},
    {title:'Most burpees',key:'burpees',unit:'burpees',color:'#c02828'},
    {title:'Longest dead hang',key:'hang',unit:'sec',color:'var(--gd)'}
  ];
  lbs.forEach(lb=>{
    const s=[...memberData].sort((a,b)=>b[lb.key]-a[lb.key]).slice(0,5);
    H+=`<div class="sec"><div class="sh"><div class="st"><div class="dot" style="background:${lb.color}"></div>${lb.title} this week</div></div>
    <div class="card">
      ${s.map((m,i)=>`<div class="lb-row">
        <div class="lb-rank">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</div>
        <div class="lb-name">${esc(m.name)}${m.isMe?' 👋':''}</div>
        <div class="lb-val" style="color:${lb.color}">${m[lb.key]} <span style="font-size:10px;color:var(--muted)">${lb.unit}</span></div>
      </div>`).join('')}
    </div></div>`;
  });

  mc.innerHTML=H;
}

function saveName(){
  const newName=document.getElementById('settingsName').value.trim();
  const dateEl=document.getElementById('settingsStartDate');
  if(!newName)return;
  userName=newName;
  document.getElementById('userBdg').textContent=userName+' · logout';
  let profile={};
  try{const p=localStorage.getItem('ohs_user_'+pin);if(p)profile=JSON.parse(p);}catch(e){}
  profile.name=newName;
  if(dateEl&&dateEl.value)profile.startDate=dateEl.value;
  try{localStorage.setItem('ohs_user_'+pin,JSON.stringify(profile));}catch(e){}
  if(SHEET)jsonp(SHEET+'?action=set&key='+encodeURIComponent(userKey())+'&value='+encodeURIComponent(JSON.stringify(profile))).catch(()=>{});
  const msg=document.getElementById('nameMsg');
  msg.style.display='block';setTimeout(()=>msg.style.display='none',2000);
  renderAll();
}

function saveInjuryOther(val){
  let profile={};
  try{const p=localStorage.getItem('ohs_user_'+pin);if(p)profile=JSON.parse(p);}catch(e){}
  profile.injuryOther=val;
  try{localStorage.setItem('ohs_user_'+pin,JSON.stringify(profile));}catch(e){}
  if(SHEET)jsonp(SHEET+'?action=set&key='+encodeURIComponent(userKey())+'&value='+encodeURIComponent(JSON.stringify(profile))).catch(()=>{});
}
function toggleInjury(part){
  let profile={};
  try{const p=localStorage.getItem('ohs_user_'+pin);if(p)profile=JSON.parse(p);}catch(e){}
  if(!profile.injuries)profile.injuries=[];
  const idx=profile.injuries.indexOf(part);
  if(idx>=0)profile.injuries.splice(idx,1);
  else profile.injuries.push(part);
  try{localStorage.setItem('ohs_user_'+pin,JSON.stringify(profile));}catch(e){}
  if(SHEET)jsonp(SHEET+'?action=set&key='+encodeURIComponent(userKey())+'&value='+encodeURIComponent(JSON.stringify(profile))).catch(()=>{});
  const msg=document.getElementById('injMsg');
  if(msg){msg.style.display='block';setTimeout(()=>msg.style.display='none',2000);}
  renderSettings();
}

function setTierManual(t){
  userTier=parseInt(t);
  const tier=TIERS[userTier];
  document.getElementById('tierPill').textContent=tier.emoji+' '+tier.name;
  document.getElementById('tierPill').style.background=tier.color;
  // Update profile
  let profile={};
  try{const p=localStorage.getItem('ohs_user_'+pin);if(p)profile=JSON.parse(p);}catch(e){}
  profile.tier=userTier;
  try{localStorage.setItem('ohs_user_'+pin,JSON.stringify(profile));}catch(e){}
  if(SHEET)jsonp(SHEET+'?action=set&key='+encodeURIComponent(userKey())+'&value='+encodeURIComponent(JSON.stringify(profile))).catch(()=>{});
  saveUserProfile();
  const msg=document.getElementById('tierMsg');
  if(msg){msg.style.display='block';setTimeout(()=>msg.style.display='none',2000);}
  renderSettings();
}
</script>
</body>
</html>
